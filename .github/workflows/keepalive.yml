# Entrustory — Supabase Keep-Alive + Uptime Tracking
#
# Free-tier Supabase projects pause automatically after 7 days with no API
# activity. This pings the project every 30 minutes to keep it active, and
# logs each check to the `uptime_checks` table so /status and the homepage
# can show real uptime/latency history instead of placeholder numbers.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL               — e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY          — the public anon key, used for the read check
#   SUPABASE_SERVICE_ROLE_KEY  — bypasses RLS; the ONLY way rows get written
#                                 to uptime_checks (no anon/authenticated
#                                 insert policy exists — see supabase_schema.sql
#                                 section 8). Never expose this key to the
#                                 frontend or log its value.
#
# Runs every 30 minutes — free on a public repo (GitHub Actions minutes are
# unlimited for public repositories).

name: Supabase Keep-Alive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    name: Health Check + Log Uptime
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase and record the result
        run: |
          result=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/blockchain_anchors?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          http_code=$(echo "$result" | awk '{print $1}')
          time_total=$(echo "$result" | awk '{print $2}')
          latency_ms=$(awk -v t="$time_total" 'BEGIN { printf "%d", t * 1000 }')

          echo "Supabase responded with HTTP $http_code in ${latency_ms}ms"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            if [ "$latency_ms" -lt 800 ]; then status="operational"; else status="degraded"; fi
          else
            status="down"
          fi

          write_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/uptime_checks" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"status\": \"$status\", \"latency_ms\": $latency_ms}")

          if [ "$write_code" -ge 300 ]; then
            echo "::error::Failed to log uptime check (HTTP $write_code)"
            exit 1
          fi
